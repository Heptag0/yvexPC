[package]
name = "yvexiq-pos"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Nombre del ejecutable, fijado aparte del nombre del paquete de arriba.
# Sin esto, Cargo usa el nombre del paquete como nombre por defecto del
# binario (yvexiq-pos.exe) -- justo lo que se veía en el Explorador de
# Windows. El paquete se queda como está (lo usa Cargo internamente);
# solo cambia el nombre del archivo .exe que ve el usuario.
[[bin]]
name = "YvexPOS"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yvexiq_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-thermal-printer = "2.0.1"
rsfbclient = { version = "0.26.0", features = ["dynamic_loading"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

# Perfil de release: quita símbolos de depuración del binario final. No
# hace que el Rust sea "más" ilegible (ya era ilegible compilado), pero
# reduce el poco rastro extra que pudiera quedar para quien intente
# desensamblarlo, y de paso el .exe pesa un poco menos.
[profile.release]
strip = true
